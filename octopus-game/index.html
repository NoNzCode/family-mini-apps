<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>海底大冒险</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232aa7b8'/%3E%3Cpath d='M14 34c8-10 22-10 30 0-8 10-22 10-30 0z' fill='%23fff'/%3E%3Cpath d='M44 34l10-8v16z' fill='%23fff'/%3E%3Ccircle cx='24' cy='32' r='3' fill='%23123a55'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #123a55;
    --ink-soft: #3d6478;
    --panel: rgba(248, 253, 255, 0.9);
    --panel-strong: rgba(255, 255, 255, 0.96);
    --line: rgba(18, 58, 85, 0.16);
    --teal: #2aa7b8;
    --coral: #ff8f6b;
    --gold: #ffc857;
    --danger: #e85d5d;
    --shadow: 0 8px 24px rgba(4, 40, 70, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0b6c9a; color: var(--ink);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #gameCanvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .hidden { display: none !important; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  button {
    font: inherit; color: var(--ink); cursor: pointer;
    border: 1px solid var(--line); border-radius: 14px;
    background: var(--panel-strong);
    transition: transform .15s ease, background .15s ease;
  }
  button:hover { transform: translateY(-1px); background: #ffffff; }
  button:active { transform: translateY(0); }
  button:focus-visible { outline: 3px solid rgba(42, 167, 184, .55); outline-offset: 2px; }

  /* HUD */
  #hud {
    position: fixed; z-index: 20; pointer-events: none;
    top: calc(12px + env(safe-area-inset-top));
    left: calc(12px + env(safe-area-inset-left));
    right: calc(12px + env(safe-area-inset-right));
    display: flex; gap: 10px; align-items: stretch;
  }
  .hudBox { pointer-events: auto; padding: 10px 14px; }
  #scoreBox { min-width: 118px; }
  .hudLabel { display: block; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--ink-soft); }
  #scoreVal { display: inline-block; font-size: 32px; font-weight: 900; line-height: 1.1; }
  #scoreVal.bump { animation: scoreBump .25s ease-out; }
  @keyframes scoreBump { 40% { transform: scale(1.18); color: #d98b00; } }
  .bestLine { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  #growthBox { flex: 1; max-width: 380px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  .growthTop { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  #stageName { font-size: 15px; font-weight: 800; }
  #growthText { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
  .bar { height: 10px; border-radius: 999px; background: rgba(18, 58, 85, .12); overflow: hidden; }
  #growthFill { height: 100%; width: 0%; border-radius: inherit; background: linear-gradient(90deg, var(--teal), #6fd3c7); transition: width .2s ease; }
  #statusBox { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  #lives { display: flex; align-items: center; gap: 5px; }
  .lifeDot { width: 13px; height: 13px; border-radius: 50%; background: var(--coral); box-shadow: inset 0 -2px 0 rgba(0,0,0,.08); }
  .lifeDot.lost { background: rgba(18, 58, 85, .16); }
  .hudBtn { min-width: 44px; min-height: 44px; padding: 8px 12px; font-size: 13px; font-weight: 700; }
  .hudBtn.off { color: #7a8b95; background: rgba(235, 240, 243, .92); }

  #effects {
    position: fixed; z-index: 20; pointer-events: none;
    left: calc(12px + env(safe-area-inset-left));
    bottom: calc(64px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .effectChip { padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 800; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
  #controlHint {
    position: fixed; z-index: 20; pointer-events: none;
    left: 50%; transform: translateX(-50%);
    bottom: calc(12px + env(safe-area-inset-bottom));
    padding: 8px 18px; font-size: 13px; color: var(--ink-soft); white-space: nowrap;
  }
  #controlHint kbd { background: rgba(18,58,85,.08); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-size: 12px; }
  .touchHint { display: none; }

  #toast {
    position: fixed; z-index: 30; pointer-events: none;
    top: 28%; left: 50%; transform: translate(-50%, -8px);
    padding: 12px 26px; border-radius: 999px;
    background: var(--panel-strong); border: 1px solid var(--line); box-shadow: var(--shadow);
    font-size: 20px; font-weight: 900; opacity: 0; transition: opacity .2s ease, transform .2s ease;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Overlays */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
    background: radial-gradient(circle at 50% 36%, rgba(120, 210, 235, .35), rgba(6, 42, 74, .72));
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
  }
  .overlay h1 { font-size: clamp(38px, 7vw, 72px); letter-spacing: 4px; color: #ffffff; text-shadow: 0 3px 14px rgba(4, 40, 70, .5); margin-bottom: 12px; }
  .overlay .subtitle { font-size: clamp(15px, 2.4vw, 20px); color: #eaf7ff; margin-bottom: 28px; max-width: 620px; line-height: 1.7; }
  .primaryBtn { padding: 14px 44px; font-size: 20px; font-weight: 900; color: #7a4a00; background: var(--gold); border-color: rgba(122, 74, 0, .25); box-shadow: 0 6px 20px rgba(4, 40, 70, .25); }
  .primaryBtn:hover { background: #ffd47a; }
  .rules { margin-top: 28px; padding: 16px 24px; max-width: 560px; font-size: 14px; line-height: 2; color: var(--ink-soft); text-align: left; }
  .rules strong { color: var(--ink); }
  .resultCard { padding: 22px 34px; margin-bottom: 24px; min-width: 260px; }
  .resultCard .big { font-size: 42px; font-weight: 900; }
  .resultCard .sub { font-size: 14px; color: var(--ink-soft); margin-top: 6px; }
  .overlayBtns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .secondaryBtn { padding: 12px 28px; font-size: 16px; font-weight: 800; }

  #loading { z-index: 100; background: radial-gradient(circle at 50% 40%, #4fc3f7, #01579b); color: #fff; }
  .spinner { width: 56px; height: 56px; border: 6px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { font-size: 18px; font-weight: 700; letter-spacing: 2px; }

  @media (max-width: 700px) {
    #hud { flex-wrap: wrap; gap: 8px; }
    #scoreBox { min-width: 96px; padding: 8px 12px; }
    #scoreVal { font-size: 26px; }
    #growthBox { order: 3; flex-basis: 100%; max-width: none; padding: 8px 12px; }
    #statusBox { gap: 6px; padding: 6px 8px; }
    .hudBtn { min-width: 44px; min-height: 44px; padding: 6px 9px; font-size: 12px; }
    .lifeDot { width: 11px; height: 11px; }
    .keyboardHint { display: none; }
    .touchHint { display: inline; }
    #controlHint { font-size: 12px; padding: 7px 14px; max-width: calc(100vw - 24px); white-space: normal; text-align: center; }
    #effects { bottom: calc(76px + env(safe-area-inset-bottom)); }
    .rules { font-size: 13px; padding: 14px 18px; }
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="hud" class="hidden">
  <div id="scoreBox" class="hudBox panel">
    <span class="hudLabel">得分</span>
    <span id="scoreVal">0</span>
    <div class="bestLine">最高 <span id="bestVal">0</span></div>
  </div>
  <div id="growthBox" class="hudBox panel">
    <div class="growthTop"><span id="stageName">幼鲨</span><span id="growthText">0 / 6</span></div>
    <div class="bar"><div id="growthFill"></div></div>
  </div>
  <div id="statusBox" class="hudBox panel">
    <div id="lives" aria-label="生命"></div>
    <button id="pauseBtn" class="hudBtn" type="button">暂停</button>
    <button id="soundBtn" class="hudBtn" type="button" aria-pressed="false">有声</button>
    <button id="motionBtn" class="hudBtn" type="button" aria-pressed="false">动效</button>
  </div>
</div>

<div id="effects"></div>
<div id="controlHint" class="panel">
  <span class="keyboardHint"><kbd>WASD</kbd>/<kbd>方向键</kbd> 移动 · <kbd>P</kbd> 暂停 · <kbd>M</kbd> 静音 · <kbd>R</kbd> 重开</span>
  <span class="touchHint">按住画面拖动游动 · 吃小躲大 · 收集道具泡</span>
</div>
<div id="toast" role="status"></div>

<div id="startScreen" class="overlay hidden">
  <h1>海底大冒险</h1>
  <div class="subtitle">从幼鲨开始，吃下较小的猎物成长，躲开比你大的家伙，一路长成成年鲨鱼。</div>
  <button id="startBtn" class="primaryBtn" type="button">开始冒险</button>
  <div class="rules panel">
    <strong>成长：</strong>填满成长条即可晋级，共三个阶段。<br>
    <strong>生命：</strong>三次受伤后结束；护盾可抵挡一次，受伤后短暂无敌。<br>
    <strong>道具：</strong>加速、磁铁、护盾藏在气泡里；金色鱼得分更高。<br>
    <strong>操作：</strong>键盘 WASD/方向键，或按住画面拖动。
  </div>
</div>

<div id="pauseScreen" class="overlay hidden">
  <h1>已暂停</h1>
  <div class="subtitle">休息一下，海底世界等你回来。</div>
  <div class="overlayBtns">
    <button id="continueBtn" class="primaryBtn" type="button">继续</button>
    <button id="pauseRestartBtn" class="secondaryBtn" type="button">重新开始</button>
  </div>
</div>

<div id="resultScreen" class="overlay hidden">
  <h1 id="resultTitle">冒险完成</h1>
  <div class="resultCard panel">
    <div class="big" id="finalScore">0</div>
    <div class="sub">本局得分 · 最高 <span id="finalBest">0</span></div>
    <div class="sub" id="finalStage">幼鲨</div>
  </div>
  <button id="resultBtn" class="primaryBtn" type="button">再来一局</button>
</div>

<div id="loading" class="overlay">
  <div class="spinner"></div>
  <p>正在加载海底世界...</p>
</div>

<script>
'use strict';

// ============================================================
// 海底大冒险：成长 / 避险 / 道具 / 触控
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const $ = (id) => document.getElementById(id);

const KEY_BEST = 'octopus_best_score';
const KEY_SETTINGS = 'octopus_settings';

const STAGES = [
  { name: '幼鲨', radius: 40, need: 6 },
  { name: '少年鲨鱼', radius: 65, need: 10 },
  { name: '成年鲨鱼', radius: 95, need: 14 }
];
const BASE_SCORE = { fish: 2, octopus: 5, jellyfish: 5, shark: 0 };
const ENTITY_TYPES = {
  shark:     { radius: 100, speed: 260, eats: [], frameMs: 100, name: '鲨鱼' },
  octopus:   { radius: 28, speed: 120, eats: ['fish'], frameMs: 140, name: '章鱼' },
  jellyfish: { radius: 30, speed: 110, eats: ['fish'], frameMs: 160, name: '水母' },
  fish:      { radius: 15, speed: 85, eats: [], frameMs: 100, name: '小鱼' }
};
const POWER_TYPES = [
  { id: 'speed', label: '加速', char: '速', color: '#ffc857', dur: 8 },
  { id: 'magnet', label: '磁铁', char: '磁', color: '#ff8f6b', dur: 8 },
  { id: 'shield', label: '护盾', char: '盾', color: '#6fd3c7', dur: 0 }
];

// ---- 安全存储 ----
function readBest() {
  try {
    const n = parseInt(localStorage.getItem(KEY_BEST) || '0', 10);
    return Number.isFinite(n) && n >= 0 ? n : 0;
  } catch (e) { return 0; }
}
function writeBest() {
  try { localStorage.setItem(KEY_BEST, String(gameState.best)); } catch (e) {}
}
function readSettings() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY_SETTINGS) || '{}');
    return { muted: Boolean(raw && raw.muted === true), reducedMotion: Boolean(raw && raw.reducedMotion === true) };
  } catch (e) { return { muted: false, reducedMotion: false }; }
}
function writeSettings() {
  try { localStorage.setItem(KEY_SETTINGS, JSON.stringify(settings)); } catch (e) {}
}

let settings = readSettings();
let gameState = {
  state: 'loading', score: 0, best: readBest(), lives: 3, stage: 0, growth: 0,
  invT: 0, shield: false, fx: { speed: 0, magnet: 0 },
  entities: [], player: null, powerups: [], particles: [], floaters: [],
  bubbles: [], plankton: [], farFish: [], weeds: [],
  shake: 0, powerTimer: 10, elapsed: 0, ambientT: 0, hudT: 0
};

// ---- 画布与缓存 ----
let W = window.innerWidth, H = window.innerHeight, DPR = 1;
const bgCanvas = document.createElement('canvas');
const bgCtx = bgCanvas.getContext('2d');
const beamCanvas = document.createElement('canvas');
const beamCtx = beamCanvas.getContext('2d');
const bubbleSprite = document.createElement('canvas');
bubbleSprite.width = bubbleSprite.height = 64;
(function buildBubbleSprite() {
  const b = bubbleSprite.getContext('2d');
  const g = b.createRadialGradient(24, 22, 4, 32, 32, 30);
  g.addColorStop(0, 'rgba(255,255,255,0.65)');
  g.addColorStop(0.6, 'rgba(255,255,255,0.14)');
  g.addColorStop(1, 'rgba(255,255,255,0.03)');
  b.fillStyle = g;
  b.beginPath(); b.arc(32, 32, 30, 0, Math.PI * 2); b.fill();
  b.strokeStyle = 'rgba(255,255,255,0.28)'; b.lineWidth = 1.5;
  b.beginPath(); b.arc(32, 32, 29, 0, Math.PI * 2); b.stroke();
})();

const ASSETS = {
  octopus: 'assets/octopus.png',
  jellyfish: 'assets/jellyfish.png',
  shark: 'assets/shark.png',
  fish: 'assets/fish.png',
  seabed: 'assets/seabed-clean.png'
};
const images = {};
const FRAME_ASSETS = (() => {
  const out = {};
  for (const t of ['fish', 'shark', 'octopus', 'jellyfish']) {
    out[t] = Array.from({ length: 12 }, (_, i) => `assets/anim/${t}_f${String(i + 1).padStart(2, '0')}.webp`);
  }
  return out;
})();
const frameImages = {};

function loadImage(key, src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => { images[key] = img; resolve(); };
    img.onerror = () => { console.error('Failed to load:', src); resolve(); };
    img.src = src;
  });
}
function loadFrame(type, idx, src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => { (frameImages[type] = frameImages[type] || [])[idx] = img; resolve(); };
    img.onerror = () => { console.error('Failed to load:', src); resolve(); };
    img.src = src;
  });
}
function getFrames(type) {
  const arr = frameImages[type];
  return (arr && arr.length === 12 && arr.every(Boolean)) ? arr : null;
}

function buildBackground() {
  bgCanvas.width = canvas.width; bgCanvas.height = canvas.height;
  bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const grad = bgCtx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#7fd8ef'); grad.addColorStop(0.5, '#2a9fd0'); grad.addColorStop(1, '#0b6c9a');
  bgCtx.fillStyle = grad; bgCtx.fillRect(0, 0, W, H);
  if (images.seabed) {
    const img = images.seabed;
    const scale = Math.max(W / img.width, H / img.height);
    const w = img.width * scale, h = img.height * scale;
    bgCtx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
  }
  const vg = bgCtx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(2,26,48,0.26)');
  bgCtx.fillStyle = vg; bgCtx.fillRect(0, 0, W, H);
}
function buildBeams() {
  beamCanvas.width = canvas.width; beamCanvas.height = canvas.height;
  beamCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  beamCtx.clearRect(0, 0, W, H);
  beamCtx.globalCompositeOperation = 'lighter';
  const beams = [
    { x: 0.22, angle: -0.35, w: 0.12 },
    { x: 0.55, angle: 0.20, w: 0.16 },
    { x: 0.82, angle: -0.15, w: 0.10 }
  ];
  for (const b of beams) {
    const baseX = W * b.x;
    const topW = W * b.w, botW = topW * 2.4;
    const skew = Math.tan(b.angle) * H;
    const g = beamCtx.createLinearGradient(baseX, 0, baseX + skew, H);
    g.addColorStop(0, 'rgba(210,245,255,0.12)'); g.addColorStop(1, 'rgba(210,245,255,0)');
    beamCtx.fillStyle = g;
    beamCtx.beginPath();
    beamCtx.moveTo(baseX - topW / 2, 0);
    beamCtx.lineTo(baseX + topW / 2, 0);
    beamCtx.lineTo(baseX + skew + botW / 2, H);
    beamCtx.lineTo(baseX + skew - botW / 2, H);
    beamCtx.closePath(); beamCtx.fill();
  }
  beamCtx.globalCompositeOperation = 'source-over';
}
function resizeCanvas() {
  const oldW = W, oldH = H;
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildBackground(); buildBeams();
  if (oldW > 0 && oldH > 0 && gameState.entities.length) {
    const sx = W / oldW, sy = H / oldH;
    for (const e of gameState.entities) { e.x *= sx; e.y *= sy; }
    for (const p of gameState.powerups) { p.x *= sx; p.y *= sy; }
    if (gameState.player) {
      const p = gameState.player;
      p.x = Math.max(p.radius, Math.min(W - p.radius, p.x));
      p.y = Math.max(p.radius, Math.min(H - p.radius, p.y));
    }
  }
}
window.addEventListener('resize', resizeCanvas);

// ---- 音效（Web Audio，本地生成）----
let audioCtx = null;
function ensureAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { audioCtx = null; }
}
function tone(freq, dur, type, vol, slideTo) {
  if (!audioCtx || settings.muted) return;
  try {
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    gain.gain.setValueAtTime(vol || 0.06, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  } catch (e) {}
}
function playSound(name) {
  if (settings.muted || !audioCtx) return;
  if (name === 'eat') tone(520, 0.12, 'sine', 0.05, 760);
  else if (name === 'gold') { tone(660, 0.12, 'triangle', 0.06, 990); tone(990, 0.16, 'sine', 0.04, 1320); }
  else if (name === 'grow') { tone(440, 0.16, 'triangle', 0.06, 660); setTimeout(() => tone(660, 0.2, 'triangle', 0.06, 880), 120); }
  else if (name === 'hurt') tone(180, 0.25, 'sawtooth', 0.05, 90);
  else if (name === 'power') tone(700, 0.18, 'sine', 0.05, 1100);
  else if (name === 'shield') tone(300, 0.2, 'triangle', 0.05, 520);
  else if (name === 'win') { tone(523, 0.18, 'triangle', 0.06); setTimeout(() => tone(659, 0.18, 'triangle', 0.06), 150); setTimeout(() => tone(784, 0.3, 'triangle', 0.06), 300); }
}

// ---- 背景音乐（Web Audio 本地合成，循环播放）----
const MUSIC_CHORDS = [
  [261.63, 329.63, 392.00], // C
  [220.00, 261.63, 329.63], // Am
  [174.61, 220.00, 261.63], // F
  [196.00, 246.94, 293.66]  // G
];
const MUSIC_SCALE = [523.25, 587.33, 659.25, 783.99, 880.00]; // C 大调五声
const MUSIC_STEP = 0.5; // 每步秒数
let musicGain = null, musicTimer = null, musicNextT = 0, musicStep = 0;
function musicNote(freq, t, dur, vol, type) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.08);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(musicGain);
  o.start(t); o.stop(t + dur + 0.05);
}
function scheduleMusic() {
  if (!audioCtx || !musicGain) return;
  const ahead = audioCtx.currentTime + 0.7;
  if (musicNextT < audioCtx.currentTime) musicNextT = audioCtx.currentTime + 0.05;
  while (musicNextT < ahead) {
    const chord = MUSIC_CHORDS[Math.floor(musicStep / 8) % MUSIC_CHORDS.length];
    if (musicStep % 8 === 0) {
      for (const f of chord) { musicNote(f / 2, musicNextT, 3.6, 0.030, 'sine'); musicNote(f, musicNextT, 3.2, 0.016, 'triangle'); }
    }
    if (musicStep % 2 === 0 && Math.random() < 0.7) {
      const idx = (Math.floor(musicStep / 2) + (Math.random() < 0.3 ? 1 : 0)) % MUSIC_SCALE.length;
      musicNote(MUSIC_SCALE[idx], musicNextT, 0.55, 0.026, 'triangle');
    }
    musicNextT += MUSIC_STEP; musicStep++;
  }
}
function setMusicPlaying(on) {
  if (!audioCtx) return;
  try {
    if (!musicGain) { musicGain = audioCtx.createGain(); musicGain.gain.value = 0.0001; musicGain.connect(audioCtx.destination); }
    const target = (on && !settings.muted) ? 0.8 : 0.0001;
    musicGain.gain.setTargetAtTime(target, audioCtx.currentTime, 0.25);
    if (on && !musicTimer) { musicTimer = setInterval(scheduleMusic, 200); scheduleMusic(); }
    if (!on && musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  } catch (e) {}
}

// ---- 实体 ----
class Entity {
  constructor(type, x, y, isPlayer = false, radiusOverride = 0, gold = false) {
    this.type = type;
    this.config = ENTITY_TYPES[type];
    this.x = x; this.y = y; this.vx = 0; this.vy = 0;
    this.radius = radiusOverride || this.config.radius;
    this.isAlive = true; this.respawnTimer = 0; this.isPlayer = isPlayer;
    this.gold = gold;
    this.sprite = images[type];
    this.frames = getFrames(type);
    const refImg = this.frames ? this.frames[0] : this.sprite;
    this.imgRatio = (refImg && refImg.width && refImg.height) ? refImg.width / refImg.height : 1;
    this.animT = Math.random() * 3000;
    this.baseDirection = Math.random() < 0.5 ? 1 : -1;
    this.wanderAngle = (this.baseDirection === 1 ? 0 : Math.PI) + (Math.random() - 0.5) * 0.4;
    this.wanderTimer = 2 + Math.random() * 4;
    this.flashTimer = 0; this.biteTimer = 0;
    this.speed = this.config.speed * (0.85 + Math.random() * 0.3);
    if (isPlayer) this.speed = ENTITY_TYPES.shark.speed;
  }

  update(dt) {
    if (!this.isAlive) {
      this.respawnTimer -= dt;
      if (this.respawnTimer <= 0) this.respawn();
      return;
    }
    if (this.flashTimer > 0) this.flashTimer -= dt;
    if (this.biteTimer > 0) this.biteTimer -= dt;
    if (this.frames) {
      if (this.type === 'octopus' || this.type === 'jellyfish') this.animT += dt * 1000;
      else {
        const spNow = Math.hypot(this.vx, this.vy);
        this.animT += dt * 1000 * (0.35 + 0.65 * Math.min(1, spNow / this.speed));
      }
    }
    if (this.isPlayer) this.updatePlayer(dt);
    else this.updateAI(dt);
    this.x += this.vx * dt;
    this.y += this.vy * dt;

    if (this.isPlayer) {
      if (this.x < this.radius) { this.x = this.radius; this.vx = 0; }
      if (this.x > W - this.radius) { this.x = W - this.radius; this.vx = 0; }
      if (this.y < this.radius) { this.y = this.radius; this.vy = 0; }
      if (this.y > H - this.radius) { this.y = H - this.radius; this.vy = 0; }
    } else {
      const margin = this.radius * 3;
      if (this.x < -margin || this.x > W + margin || this.y < -margin || this.y > H + margin) this.respawnFromEdge();
    }
  }

  updatePlayer(dt) {
    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    const sp = this.speed * (gameState.fx.speed > 0 ? 1.6 : 1);
    let tvx = 0, tvy = 0;
    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      tvx = dx / len * sp; tvy = dy / len * sp;
    } else if (pointer.active) {
      const px = pointer.x - this.x, py = pointer.y - this.y;
      const dist = Math.hypot(px, py);
      if (dist > 6) { tvx = px / dist * sp; tvy = py / dist * sp; }
    }
    const k = Math.min(1, dt * 10);
    this.vx += (tvx - this.vx) * k;
    this.vy += (tvy - this.vy) * k;
    if (tvx === 0 && tvy === 0) {
      const damp = Math.exp(-8 * dt);
      this.vx *= damp; this.vy *= damp;
    }
  }

  updateAI(dt) {
    const p = gameState.player;
    if (p && gameState.fx.magnet > 0 && this.radius <= p.radius * 0.9) {
      const dx = p.x - this.x, dy = p.y - this.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 260 && dist > 1) {
        this.vx += (dx / dist * this.speed * 1.4 - this.vx) * Math.min(1, dt * 4);
        this.vy += (dy / dist * this.speed * 1.4 - this.vy) * Math.min(1, dt * 4);
        return;
      }
    }
    if (p && p.isAlive && p.radius > this.radius * 1.1) {
      const dx = this.x - p.x, dy = this.y - p.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 150 && dist > 1) {
        const sp = this.speed * 1.25;
        this.vx += (dx / dist * sp - this.vx) * Math.min(1, dt * 3);
        this.vy += (dy / dist * sp - this.vy) * Math.min(1, dt * 3);
        return;
      }
    }
    this.wander(dt, this.speed * 0.8);
  }

  wander(dt, speed) {
    this.wanderTimer -= dt;
    if (this.wanderTimer <= 0) {
      if (this.type === 'fish') {
        if (Math.random() < 0.12) this.baseDirection *= -1;
        const baseAngle = this.baseDirection === 1 ? 0 : Math.PI;
        this.wanderAngle = baseAngle + (Math.random() - 0.5) * 0.5;
        this.wanderTimer = 4 + Math.random() * 5;
      } else {
        this.wanderAngle += (Math.random() - 0.5) * 0.5;
        this.wanderTimer = 1.5 + Math.random() * 2;
      }
    }
    const k = Math.min(1, dt * 2);
    this.vx += (Math.cos(this.wanderAngle) * speed - this.vx) * k;
    this.vy += (Math.sin(this.wanderAngle) * speed - this.vy) * k;
    if (this.type === 'jellyfish') this.vy += Math.sin(gameState.elapsed * 2 + this.animT * 0.001) * 12 * dt;
  }

  die() {
    this.isAlive = false;
    this.respawnTimer = 2 + Math.random() * 1.5;
    this.vx = 0; this.vy = 0;
  }
  respawn() {
    this.isAlive = true;
    this.flashTimer = 0.5;
    this.respawnFromEdge();
  }
  respawnFromEdge() {
    const side = Math.floor(Math.random() * 4);
    const margin = this.radius * 2;
    if (side === 0) { this.x = Math.random() * W; this.y = -margin; this.wanderAngle = Math.PI / 2 + (Math.random() - 0.5) * 0.5; }
    else if (side === 1) { this.x = Math.random() * W; this.y = H + margin; this.wanderAngle = -Math.PI / 2 + (Math.random() - 0.5) * 0.5; }
    else if (side === 2) { this.x = -margin; this.y = Math.random() * H; this.wanderAngle = (Math.random() - 0.5) * 0.5; this.baseDirection = 1; }
    else { this.x = W + margin; this.y = Math.random() * H; this.wanderAngle = Math.PI + (Math.random() - 0.5) * 0.5; this.baseDirection = -1; }
    const speed = this.speed * 0.8;
    this.vx = Math.cos(this.wanderAngle) * speed;
    this.vy = Math.sin(this.wanderAngle) * speed;
  }

  draw() {
    if (!this.isAlive) return;
    const img = this.frames ? this.frames[Math.floor(this.animT / this.config.frameMs) % this.frames.length] : this.sprite;
    if (!img) return;
    const depth = Math.min(1, Math.max(0, this.y / H));
    const depthAlpha = 0.84 + 0.16 * depth;
    const depthScale = 0.92 + 0.08 * depth;
    const p = gameState.player;

    ctx.save();
    ctx.translate(this.x, this.y);

    if (!this.isPlayer && p && this.radius >= p.radius * 1.15) {
      ctx.save();
      ctx.strokeStyle = 'rgba(232, 93, 93, 0.65)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath(); ctx.arc(0, 0, this.radius + 8, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    if (this.type === 'fish') { if (this.vx > 0) ctx.scale(-1, 1); }
    else { if (this.vx < 0) ctx.scale(-1, 1); }
    if ((this.type === 'fish' || this.type === 'shark') && !settings.reducedMotion) {
      const tilt = Math.max(-0.16, Math.min(0.16, this.vy / Math.max(1, this.speed) * 0.3));
      ctx.rotate(this.vx < 0 ? -tilt : tilt);
    }

    let alpha = depthAlpha;
    if (this.flashTimer > 0) alpha *= 0.5 + 0.3 * Math.sin(this.flashTimer * 30);
    if (this.isPlayer && gameState.invT > 0 && Math.floor(gameState.elapsed * 12) % 2 === 0) alpha *= 0.45;
    ctx.globalAlpha = alpha;

    if (this.gold) { ctx.shadowColor = 'rgba(255, 200, 87, 0.9)'; ctx.shadowBlur = 18; }
    else if (this.isPlayer) { ctx.shadowColor = 'rgba(120, 220, 255, 0.45)'; ctx.shadowBlur = 14; }

    let biteScale = 1;
    if (this.biteTimer > 0) biteScale = 1 + 0.12 * Math.sin((0.18 - this.biteTimer) / 0.18 * Math.PI);
    const maxW = this.radius * 2.5 * depthScale * biteScale;
    let drawW, drawH;
    if (this.imgRatio > 1) { drawW = maxW; drawH = maxW / this.imgRatio; }
    else { drawH = maxW; drawW = maxW * this.imgRatio; }
    ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
    ctx.restore();

    if (this.isPlayer && gameState.shield) {
      ctx.save();
      ctx.strokeStyle = 'rgba(111, 211, 199, 0.9)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius + 10 + Math.sin(gameState.elapsed * 5) * 2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }
}

// ---- 输入 ----
const keys = {};
const pointer = { active: false, id: null, x: 0, y: 0 };
function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
canvas.addEventListener('pointerdown', (e) => {
  if (gameState.state !== 'playing') return;
  e.preventDefault();
  pointer.active = true; pointer.id = e.pointerId;
  const pt = canvasPoint(e); pointer.x = pt.x; pointer.y = pt.y;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
canvas.addEventListener('pointermove', (e) => {
  if (!pointer.active || e.pointerId !== pointer.id) return;
  e.preventDefault();
  const pt = canvasPoint(e); pointer.x = pt.x; pointer.y = pt.y;
});
function releasePointer(e) {
  if (e.pointerId !== pointer.id) return;
  pointer.active = false; pointer.id = null;
  try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
}
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);

window.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  keys[key] = true;
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(key)) e.preventDefault();
  if (key === 'r' && gameState.state !== 'loading' && gameState.state !== 'menu') startGame();
  if (key === 'p' || key === 'escape') togglePause();
  if (key === 'm') toggleSound();
});
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; pointer.active = false; });

// ---- 世界生成 ----
function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function spawnWorld() {
  gameState.entities = [];
  const cx = W / 2, cy = H / 2;
  const player = new Entity('shark', cx, cy, true, STAGES[0].radius);
  gameState.player = player;
  gameState.entities.push(player);

  // 出生安全区：NPC 不得贴着玩家中心生成，避免开局/重开瞬间掉命或白送成长。
  const safeDist = (e) => STAGES[0].radius + e.radius + 60;
  const placeAway = (e) => {
    for (let t = 0; t < 24; t++) {
      if (Math.hypot(e.x - cx, e.y - cy) >= safeDist(e)) return;
      e.x = rand(50, W - 50); e.y = rand(60, H - 60);
    }
    const a = Math.random() * Math.PI * 2, d = safeDist(e) + 20;
    e.x = Math.max(50, Math.min(W - 50, cx + Math.cos(a) * d));
    e.y = Math.max(60, Math.min(H - 60, cy + Math.sin(a) * d));
  };

  const fishSizes = [12, 18, 26, 38, 52];
  for (let i = 0; i < 26; i++) {
    const r = pick(fishSizes);
    const gold = Math.random() < 0.1;
    const e = new Entity('fish', rand(50, W - 50), rand(60, H - 60), false, r, gold);
    placeAway(e); gameState.entities.push(e);
  }
  const octSizes = [26, 42, 62, 78];
  for (let i = 0; i < 4; i++) { const e = new Entity('octopus', rand(60, W - 60), rand(70, H - 70), false, pick(octSizes)); placeAway(e); gameState.entities.push(e); }
  const jellySizes = [28, 46, 68, 82];
  for (let i = 0; i < 3; i++) { const e = new Entity('jellyfish', rand(60, W - 60), rand(70, H - 70), false, pick(jellySizes)); placeAway(e); gameState.entities.push(e); }
}
function initAmbient() {
  gameState.bubbles = [];
  for (let i = 0; i < 24; i++) gameState.bubbles.push({ x: Math.random() * W, y: Math.random() * H, r: 3 + Math.random() * 8, speed: 18 + Math.random() * 42, drift: (Math.random() - 0.5) * 24, phase: Math.random() * Math.PI * 2 });
  gameState.plankton = [];
  for (let i = 0; i < 30; i++) gameState.plankton.push({ x: Math.random() * W, y: Math.random() * H, r: 0.8 + Math.random() * 1.6, speed: 4 + Math.random() * 10, phase: Math.random() * Math.PI * 2 });
  gameState.farFish = [];
  for (let i = 0; i < 8; i++) gameState.farFish.push({ x: Math.random() * W, y: H * (0.12 + Math.random() * 0.5), size: 8 + Math.random() * 14, speed: 8 + Math.random() * 16, dir: Math.random() < 0.5 ? 1 : -1, phase: Math.random() * Math.PI * 2 });
  gameState.weeds = [];
  const spots = [0.04, 0.1, 0.16, 0.84, 0.9, 0.96];
  for (const s of spots) gameState.weeds.push({ x: W * s, h: H * rand(0.1, 0.2), w: rand(10, 22), phase: Math.random() * Math.PI * 2 });
}

// ---- 游戏流程 ----
function startGame() {
  ensureAudio();
  setMusicPlaying(true);
  gameState.state = 'playing';
  gameState.score = 0; gameState.lives = 3; gameState.stage = 0; gameState.growth = 0;
  gameState.invT = 1.0; gameState.shield = false; gameState.fx = { speed: 0, magnet: 0 }; // 出生保护 1 秒
  gameState.powerups = []; gameState.particles = []; gameState.floaters = [];
  gameState.shake = 0; gameState.powerTimer = rand(8, 12); gameState.elapsed = 0; gameState.hudT = 0;
  pointer.active = false;
  spawnWorld(); initAmbient();
  $('startScreen').classList.add('hidden');
  $('pauseScreen').classList.add('hidden');
  $('resultScreen').classList.add('hidden');
  $('hud').classList.remove('hidden');
  $('pauseBtn').textContent = '暂停';
  updateHUD();
  lastTime = performance.now();
}
function togglePause(forcePause) {
  if (gameState.state === 'playing' || forcePause === true) {
    if (gameState.state !== 'playing') return;
    gameState.state = 'paused';
    pointer.active = false;
    setMusicPlaying(false);
    $('pauseScreen').classList.remove('hidden');
    $('pauseBtn').textContent = '继续';
  } else if (gameState.state === 'paused') {
    gameState.state = 'playing';
    setMusicPlaying(true);
    $('pauseScreen').classList.add('hidden');
    $('pauseBtn').textContent = '暂停';
    lastTime = performance.now();
  }
}
function endGame(won) {
  gameState.state = won ? 'won' : 'lost';
  pointer.active = false;
  setMusicPlaying(false);
  if (gameState.score > gameState.best) { gameState.best = gameState.score; writeBest(); }
  $('resultTitle').textContent = won ? '冒险完成' : '下次再战';
  $('finalScore').textContent = gameState.score;
  $('finalBest').textContent = gameState.best;
  $('finalStage').textContent = '最终阶段：' + STAGES[gameState.stage].name;
  $('resultScreen').classList.remove('hidden');
  playSound(won ? 'win' : 'hurt');
  updateHUD();
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && gameState.state === 'playing') togglePause(true);
});

// ---- 碰撞与成长 ----
function relationToPlayer(e) {
  const p = gameState.player;
  if (!p) return 'neutral';
  if (e.radius <= p.radius * 0.9) return 'edible';
  if (e.radius >= p.radius * 1.15) return 'danger';
  return 'neutral';
}
function checkCollisions() {
  const p = gameState.player;
  if (!p || !p.isAlive || gameState.state !== 'playing') return;
  for (const e of gameState.entities) {
    if (e === p || !e.isAlive || e.flashTimer > 0) continue;
    const dist = Math.hypot(p.x - e.x, p.y - e.y);
    const rel = relationToPlayer(e);
    if (rel === 'edible' && dist < p.radius + e.radius * 0.55) {
      eatPrey(e);
      if (gameState.state !== 'playing') return;
    } else if (rel === 'danger' && gameState.invT <= 0 && dist < p.radius * 0.75 + e.radius * 0.55) {
      hurtPlayer();
      if (gameState.state !== 'playing') return;
    }
  }
  for (const a of gameState.entities) {
    if (a.isPlayer || !a.isAlive || !a.config.eats.length) continue;
    for (const b of gameState.entities) {
      if (b === a || b.isPlayer || !b.isAlive || b.flashTimer > 0) continue;
      if (!a.config.eats.includes(b.type)) continue;
      if (a.radius <= b.radius * 1.1) continue;
      if (Math.hypot(a.x - b.x, a.y - b.y) < a.radius + b.radius * 0.5) b.die();
    }
  }
}
function eatPrey(e) {
  const base = BASE_SCORE[e.type] || 0;
  const gained = base * (e.gold ? 5 : 1);
  gameState.score += gained;
  gameState.growth += 1;
  if (gameState.score > gameState.best) { gameState.best = gameState.score; writeBest(); }
  e.die();
  gameState.player.biteTimer = 0.18;
  addFloater(e.x, e.y, '+' + gained, e.gold ? '#ffc857' : '#ffffff');
  burst(e.x, e.y, e.gold ? '#ffc857' : '#bfefff', settings.reducedMotion ? 5 : 12);
  playSound(e.gold ? 'gold' : 'eat');
  const need = STAGES[gameState.stage].need;
  if (gameState.growth >= need) {
    if (gameState.stage < STAGES.length - 1) {
      gameState.stage++;
      gameState.growth = 0;
      gameState.player.radius = STAGES[gameState.stage].radius;
      gameState.invT = Math.max(gameState.invT, 1);
      announce('晋级：' + STAGES[gameState.stage].name);
      burst(gameState.player.x, gameState.player.y, '#6fd3c7', settings.reducedMotion ? 8 : 24);
      playSound('grow');
    } else {
      endGame(true);
    }
  }
  updateHUD();
  bumpScore();
}
function hurtPlayer() {
  if (gameState.shield) {
    gameState.shield = false;
    gameState.invT = 1.2;
    addFloater(gameState.player.x, gameState.player.y - 30, '护盾抵挡', '#6fd3c7');
    burst(gameState.player.x, gameState.player.y, '#6fd3c7', settings.reducedMotion ? 6 : 16);
    playSound('shield');
  } else {
    gameState.lives--;
    gameState.invT = 2;
    if (!settings.reducedMotion) gameState.shake = 8;
    addFloater(gameState.player.x, gameState.player.y - 30, '受伤', '#e85d5d');
    burst(gameState.player.x, gameState.player.y, '#e85d5d', settings.reducedMotion ? 5 : 14);
    playSound('hurt');
    if (gameState.lives <= 0) { endGame(false); return; }
  }
  updateHUD();
}

// ---- 道具 ----
function spawnPowerup() {
  if (gameState.powerups.length >= 2) return;
  const type = pick(POWER_TYPES);
  gameState.powerups.push({ x: rand(60, W - 60), y: rand(80, H - 80), type, phase: Math.random() * Math.PI * 2, life: 18 });
}
function updatePowerups(dt) {
  gameState.powerTimer -= dt;
  if (gameState.powerTimer <= 0) { spawnPowerup(); gameState.powerTimer = rand(12, 18); }
  const p = gameState.player;
  for (let i = gameState.powerups.length - 1; i >= 0; i--) {
    const b = gameState.powerups[i];
    b.life -= dt; b.phase += dt * 2;
    if (b.life <= 0) { gameState.powerups.splice(i, 1); continue; }
    if (p && Math.hypot(p.x - b.x, p.y - b.y) < p.radius + 20) {
      applyPowerup(b.type);
      gameState.powerups.splice(i, 1);
    }
  }
}
function applyPowerup(type) {
  if (type.id === 'speed') gameState.fx.speed = type.dur;
  else if (type.id === 'magnet') gameState.fx.magnet = type.dur;
  else if (type.id === 'shield') gameState.shield = true;
  announce(type.label + '！');
  burst(gameState.player.x, gameState.player.y, type.color, settings.reducedMotion ? 6 : 18);
  playSound('power');
  updateHUD();
}

// ---- 粒子与浮字 ----
function burst(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rand(30, 120);
    gameState.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20, life: rand(0.4, 0.8), maxLife: 0.8, color, size: rand(2, 5) });
  }
}
function addFloater(x, y, text, color) {
  gameState.floaters.push({ x, y, text, color, life: 0.9 });
}
function updateParticles(dt) {
  for (let i = gameState.particles.length - 1; i >= 0; i--) {
    const p = gameState.particles[i];
    p.life -= dt;
    if (p.life <= 0) { gameState.particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 18 * dt;
  }
  for (let i = gameState.floaters.length - 1; i >= 0; i--) {
    const f = gameState.floaters[i];
    f.life -= dt; f.y -= 40 * dt;
    if (f.life <= 0) gameState.floaters.splice(i, 1);
  }
}
function updateAmbient(dt) {
  gameState.ambientT += dt;
  for (const b of gameState.bubbles) {
    b.y -= b.speed * dt;
    b.x += (b.drift + Math.sin((b.y + b.phase) * 0.02) * 12) * dt;
    if (b.y < -12) { b.y = H + 12; b.x = Math.random() * W; }
  }
  for (const p of gameState.plankton) {
    p.y -= p.speed * dt; p.x += Math.sin(gameState.ambientT + p.phase) * 6 * dt;
    if (p.y < -4) { p.y = H + 4; p.x = Math.random() * W; }
  }
  for (const f of gameState.farFish) {
    f.x += f.speed * f.dir * dt;
    if (f.dir > 0 && f.x > W + 30) f.x = -30;
    if (f.dir < 0 && f.x < -30) f.x = W + 30;
  }
}

// ---- HUD ----
let toastTimer = null;
function announce(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1400);
}
function updateHUD() {
  $('scoreVal').textContent = gameState.score;
  $('bestVal').textContent = gameState.best;
  const st = STAGES[gameState.stage];
  $('stageName').textContent = st.name;
  $('growthText').textContent = gameState.growth + ' / ' + st.need;
  $('growthFill').style.width = Math.min(100, gameState.growth / st.need * 100) + '%';
  const lives = $('lives');
  lives.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const d = document.createElement('span');
    d.className = 'lifeDot' + (i >= gameState.lives ? ' lost' : '');
    lives.appendChild(d);
  }
  const fx = [];
  if (gameState.fx.speed > 0) fx.push('加速 ' + Math.ceil(gameState.fx.speed) + 's');
  if (gameState.fx.magnet > 0) fx.push('磁铁 ' + Math.ceil(gameState.fx.magnet) + 's');
  if (gameState.shield) fx.push('护盾');
  const box = $('effects');
  box.innerHTML = '';
  for (const t of fx) {
    const c = document.createElement('span');
    c.className = 'effectChip'; c.textContent = t;
    box.appendChild(c);
  }
  const sb = $('soundBtn');
  sb.textContent = settings.muted ? '静音' : '有声';
  sb.classList.toggle('off', settings.muted);
  sb.setAttribute('aria-pressed', String(settings.muted));
  const mb = $('motionBtn');
  mb.textContent = settings.reducedMotion ? '简动' : '动效';
  mb.classList.toggle('off', settings.reducedMotion);
  mb.setAttribute('aria-pressed', String(settings.reducedMotion));
}
function bumpScore() {
  const el = $('scoreVal');
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
}
function toggleSound() {
  settings.muted = !settings.muted;
  writeSettings(); updateHUD();
  setMusicPlaying(gameState.state === 'playing');
}
function toggleMotion() {
  settings.reducedMotion = !settings.reducedMotion;
  writeSettings(); updateHUD();
}

// ---- 绘制 ----
function drawFarFish() {
  ctx.save();
  ctx.fillStyle = 'rgba(10, 60, 95, 0.14)';
  for (const f of gameState.farFish) {
    const y = f.y + Math.sin(gameState.ambientT * 0.8 + f.phase) * 6;
    ctx.save();
    ctx.translate(f.x, y);
    if (f.dir < 0) ctx.scale(-1, 1);
    ctx.beginPath();
    ctx.ellipse(0, 0, f.size, f.size * 0.45, 0, 0, Math.PI * 2);
    ctx.moveTo(-f.size, 0);
    ctx.lineTo(-f.size * 1.6, -f.size * 0.5);
    ctx.lineTo(-f.size * 1.6, f.size * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}
function drawBubbles() {
  for (const b of gameState.bubbles) {
    const s = b.r * 2.2;
    ctx.drawImage(bubbleSprite, b.x - s / 2, b.y - s / 2, s, s);
  }
}
function drawPlankton() {
  ctx.save();
  ctx.fillStyle = 'rgba(230, 250, 255, 0.35)';
  for (const p of gameState.plankton) {
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function drawPowerups() {
  for (const b of gameState.powerups) {
    const y = b.y + Math.sin(b.phase) * 5;
    ctx.save();
    ctx.globalAlpha = b.life < 3 ? (Math.floor(b.life * 6) % 2 ? 0.35 : 0.9) : 0.95;
    ctx.fillStyle = b.type.color;
    ctx.beginPath(); ctx.arc(b.x, y, 18, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, y, 18, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#123a55'; ctx.font = '900 15px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.type.char, b.x, y + 1);
    ctx.restore();
  }
}
function drawParticles() {
  for (const p of gameState.particles) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}
function drawFloaters() {
  ctx.save();
  ctx.font = '900 20px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  for (const f of gameState.floaters) {
    ctx.globalAlpha = Math.max(0, f.life / 0.9);
    ctx.fillStyle = f.color;
    ctx.strokeStyle = 'rgba(6,42,74,0.5)'; ctx.lineWidth = 3;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.restore();
}
function drawForeground() {
  ctx.save();
  ctx.globalAlpha = 0.2;
  ctx.fillStyle = '#0a4a6e';
  for (const w of gameState.weeds) {
    const sway = settings.reducedMotion ? 0 : Math.sin(gameState.ambientT * 0.9 + w.phase) * 10;
    ctx.beginPath();
    ctx.moveTo(w.x - w.w / 2, H);
    ctx.quadraticCurveTo(w.x + sway, H - w.h * 0.6, w.x + sway * 1.4, H - w.h);
    ctx.quadraticCurveTo(w.x + w.w / 2 + sway, H - w.h * 0.5, w.x + w.w / 2, H);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}
function drawScene() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (gameState.shake > 0 && !settings.reducedMotion) {
    ctx.translate((Math.random() - 0.5) * gameState.shake, (Math.random() - 0.5) * gameState.shake);
  }
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  drawFarFish();
  ctx.save();
  ctx.globalAlpha = 0.75 + 0.15 * Math.sin(gameState.ambientT * 0.4);
  ctx.drawImage(beamCanvas, Math.sin(gameState.ambientT * 0.3) * 12, 0, W, H);
  ctx.restore();
  drawPlankton();
  drawBubbles();
  drawPowerups();
  const fish = [], others = [];
  for (const e of gameState.entities) {
    if (e.isPlayer) continue;
    if (e.type === 'fish') fish.push(e);
    else others.push(e);
  }
  for (const e of fish) e.draw();
  for (const e of others) e.draw();
  if (gameState.player) gameState.player.draw();
  drawParticles();
  drawFloaters();
  drawForeground();
  ctx.restore();
}

// ---- 主循环 ----
let lastTime = performance.now();
function update(dt) {
  gameState.elapsed += dt;
  if (gameState.invT > 0) gameState.invT = Math.max(0, gameState.invT - dt);
  if (gameState.fx.speed > 0) gameState.fx.speed = Math.max(0, gameState.fx.speed - dt);
  if (gameState.fx.magnet > 0) gameState.fx.magnet = Math.max(0, gameState.fx.magnet - dt);
  if (gameState.shake > 0) gameState.shake = Math.max(0, gameState.shake - dt * 40);
  for (const e of gameState.entities) e.update(dt);
  checkCollisions();
  if (gameState.state !== 'playing') return;
  updatePowerups(dt);
  updateParticles(dt);
  updateAmbient(dt);
  gameState.hudT += dt;
  if (gameState.hudT >= 0.25) { gameState.hudT = 0; updateHUD(); }
}
function gameLoop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.033);
  lastTime = now;
  if (gameState.state === 'playing') update(dt);
  else if (gameState.state !== 'paused') updateAmbient(dt);
  drawScene();
  requestAnimationFrame(gameLoop);
}

// ---- 按钮 ----
$('startBtn').addEventListener('click', startGame);
$('pauseBtn').addEventListener('click', () => togglePause());
$('continueBtn').addEventListener('click', () => togglePause());
$('pauseRestartBtn').addEventListener('click', startGame);
$('resultBtn').addEventListener('click', startGame);
$('soundBtn').addEventListener('click', toggleSound);
$('motionBtn').addEventListener('click', toggleMotion);

// ---- 启动 ----
async function init() {
  const loadPromises = Object.entries(ASSETS).map(([key, src]) => loadImage(key, src));
  const framePromises = Object.entries(FRAME_ASSETS).flatMap(([type, arr]) => arr.map((src, i) => loadFrame(type, i, src)));
  await Promise.all([...loadPromises, ...framePromises]);
  resizeCanvas();
  initAmbient();
  $('loading').classList.add('hidden');
  $('startScreen').classList.remove('hidden');
  gameState.state = 'menu';
  updateHUD();
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}
init();
</script>
